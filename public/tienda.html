<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda · SampCity</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #141a22;
      --border: #232c37;
      --text: #e8edf3;
      --muted: #94a3b8;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .store {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .product {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      background: #10161d;
    }

    .product h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .product .amount {
      color: var(--accent);
      font-weight: 700;
    }

    .product .price {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      background: var(--accent);
      color: #04140a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .35);
      color: #fecaca;
    }

    .message.info {
      display: block;
      background: rgba(34, 197, 94, .12);
      border: 1px solid rgba(34, 197, 94, .35);
      color: #bbf7d0;
    }

    .orders {
      margin-top: 26px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .orders h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .order {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .status {
      font-weight: 700;
    }

    .status.pending { color: #fbbf24; }
    .status.paid { color: #60a5fa; }
    .status.delivered { color: var(--accent); }
    .status.failed { color: var(--danger); }

    .empty {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="store">
    <h1>Tienda SampCity</h1>
    <p class="subtitle">Compra coins para tu cuenta. El pago se procesa de forma segura con Tebex.</p>

    <section id="products">
      <div class="product">
        <h2>10 Coins</h2>
        <p class="amount">10 coins para tu cuenta</p>
        <p class="price" id="price">Cargando precio…</p>
        <button id="buy" disabled>Cargando…</button>
      </div>
    </section>

    <div id="message" class="message"></div>

    <section class="orders">
      <h3>Mis compras</h3>
      <div id="orders" class="empty">Cargando historial…</div>
    </section>
  </main>

  <script>
    const message = document.getElementById("message");
    const buyButton = document.getElementById("buy");
    const priceElement = document.getElementById("price");
    const ordersElement = document.getElementById("orders");

    const showMessage = (text, type = "info") => {
      message.className = `message ${type}`;
      message.textContent = text;
    };

    const hideMessage = () => {
      message.className = "message";
      message.textContent = "";
    };

    const statusText = {
      pending: "Pendiente",
      paid: "Pagado",
      delivered: "Entregado",
      failed: "Error"
    };

    async function loadCatalog() {
      try {
        const response = await fetch("/api/store/catalog");

        if (response.status === 401) {
          showMessage("Inicia sesión para ver la tienda.", "error");
          return;
        }

        const data = await response.json();
        const product = data.products?.[0];

        if (!product) {
          priceElement.textContent = "No hay productos disponibles.";
          buyButton.textContent = "No disponible";
          return;
        }

        priceElement.textContent = product.price !== null
          ? `Precio: ${product.price} ${product.currency}`
          : "El precio se mostrará en el checkout.";

        buyButton.disabled = false;
        buyButton.textContent = "Comprar 10 Coins";
        buyButton.dataset.packageId = product.packageId;
      } catch {
        priceElement.textContent = "No se pudo cargar la tienda.";
        buyButton.textContent = "Reintentar";
      }
    }

    async function loadOrders() {
      try {
        const response = await fetch("/api/store/orders");

        if (response.status === 401) {
          ordersElement.textContent = "Inicia sesión para ver tus compras.";
          return;
        }

        const data = await response.json();
        const orders = data.orders || [];

        if (!orders.length) {
          ordersElement.textContent = "Todavía no tienes compras.";
          ordersElement.className = "empty";
          return;
        }

        ordersElement.className = "";
        ordersElement.innerHTML = orders.map((order) => `
          <div class="order">
            <span>${order.product} · ${order.amount} coins</span>
            <span class="status ${order.delivery_status || order.status}">
              ${statusText[order.delivery_status] || statusText[order.status] || order.status}
            </span>
          </div>
        `).join("");
      } catch {
        ordersElement.textContent = "No se pudo cargar el historial.";
      }
    }

    async function buy() {
      const packageId = buyButton.dataset.packageId;
      if (!packageId) return;

      buyButton.disabled = true;
      buyButton.textContent = "Preparando pago…";
      hideMessage();

      try {
        const cartResponse = await fetch("/api/store/cart", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ packageId: Number(packageId) })
        });

        const cartData = await cartResponse.json();

        if (!cartResponse.ok) {
          throw new Error(cartData.error || "No se pudo crear el pedido.");
        }

        const checkoutResponse = await fetch("/api/store/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ basketIdent: cartData.basketIdent })
        });

        const checkoutData = await checkoutResponse.json();

        if (!checkoutResponse.ok || !checkoutData.checkoutUrl) {
          throw new Error(checkoutData.error || "No se pudo iniciar el pago.");
        }

        showMessage("Te estamos llevando al pago seguro de Tebex…", "info");
        window.location.href = checkoutData.checkoutUrl;
      } catch (error) {
        showMessage(error.message, "error");
        buyButton.disabled = false;
        buyButton.textContent = "Comprar 10 Coins";
      }
    }

    buyButton.addEventListener("click", buy);
    loadCatalog();
    loadOrders();
  </script>
</body>
</html>
