  const els=[...document.querySelectorAll("a[href],button")].filter(x=>x.offsetParent);e.preventDefault();if(!els.includes(a))return els[0]?.focus();
  const c=a.getBoundingClientRect(),cx=c.x+c.width/2,cy=c.y+c.height/2;let best=null,bs=1e9;
