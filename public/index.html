async top(){await info();const by=window.TB||"level",r=await api("/top?by="+by);if(!r.ok)return fail(r.d.error,"top");return `<h2 class="ttl">🏆 ${t("Clasificación")}</h2><div class="card"><div class="pgn" style="justify-content:flex-start;flex-wrap:wrap">${[["level","Nivel"],["time","Tiempo jugado"],["rep","Reputación"]].map(x=>`<button class="btn s ${x[0]===by?"p":""}" onclick="window.TB='${x[0]}';show('top')">${t(x[1])}</button>`).join("")}</div><div class="rk">${r.d.map((p,i)=>`<div><span class="n">${i+1}</span>${skin(p.skin,p.name)}<b>${esc(p.name.replace(/_/g," "))}</b><span>${by==="time"?horas(p.time_playing):by==="rep"?esc(p.rep):esc(p.level)}</span></div>`).join("")||`<p class="m">${t("Sin datos")}.</p>`}</div></div>`},

 setTimeout(()=>{if(INFO.turnstile&&$("#cft2"))captcha("#cft2")});return h},
perfil(){if(!U)return `<div class="card"><h3>👤 ${t("Mi perfil")}</h3><p class="m">${t("Inicia sesión para ver los datos de tu cuenta.")}</p><button class="btn p" style="margin-top:.7rem" onclick="login()">${t("Iniciar sesión")}</button></div>`;
 const d=U.discord;setTimeout(()=>{const p=new URLSearchParams(location.search).get("discord");if(p&&$("#dm")){$("#dm").textContent=t({ok:"¡Cuenta vinculada!",duplicado:"Esa cuenta de Discord o de SA-MP ya está vinculada.",error:"No se pudo vincular, inténtalo de nuevo."}[p]||"");if(p==="ok")$("#dm").className="msg ok";history.replaceState(null,"","/#perfil")}});
 return `<div class="card"><div class="cover"></div><div class="pr">${skin(U.skin,U.name,"lg")}<div><h2 style="font-family:'Russo One';font-weight:400">${esc(U.name.replace(/_/g," "))}</h2><span class="tag" style="margin:0">${t(U.rango)}</span>${U.vip>0?'<span class="tag">VIP</span>':""}</div></div>
 <div class="kv"><div><small>${t("Nivel")}</small><b>${esc(U.level)}</b></div><div><small>${t("Reputación")}</small><b>${esc(U.rep)}</b></div><div><small>${t("Tiempo jugado")}</small><b>${horas(U.time_playing)}</b></div><div><small>${t("Efectivo")}</small><b>${money(U.cash)}</b></div><div><small>${t("Banco")}</small><b>${money(U.bank_money)}</b></div><div><small>${t("Facción")}</small><b>${esc(U.crew||t("Ninguna"))}</b></div><div><small>${t("Teléfono")}</small><b>${esc(U.phone_number||"—")}</b></div><div><small>${t("Arrestos")}</small><b>${esc(U.arrests_count??0)}</b></div><div><small>${t("Registro")}</small><b>${fecha(U.reg_date)}</b></div><div><small>${t("Última conexión")}</small><b>${Number(U.connected)?t("En línea"):fecha(U.last_connection)}</b></div></div></div>
 <div class="card"><h3>🔗 ${t("Vincular con Discord")}</h3>${d?`<p>${t("✅ Cuenta vinculada (ID")} <b>${esc(d.discord_id)}</b>)</p><button class="btn s" style="margin-top:.6rem" onclick="desv()">${t("Desvincular")}</button>`:`<p class="m" style="font-size:.9rem">${t("Vincula tu cuenta para usar los comandos del bot y recibir tu rol.")}</p><a class="btn p" style="margin-top:.6rem" href="/auth/discord">${t("Vincular con Discord")}</a>`}<div class="msg" id="dm" role="status"></div></div>`}};

 b.disabled=true;const r=await api("/contact",{method:"POST",body:{name:n.value,contact:$("#cc").value,message:m.value,website:$("#cw").value,cf:CF}});b.disabled=false;
 if(!r.ok){resetCaptcha("#cft2");$("#cmsg").className="msg";$("#cmsg").textContent=r.d.error;return false}
 $("#ctf").reset();resetCaptcha("#cft2");$("#cmsg").className="msg ok";$("#cmsg").textContent=t("¡Mensaje enviado! Gracias.");return false}

 m.innerHTML=h;m.setAttribute("aria-busy","false");m.classList.remove("swap");void m.offsetWidth;m.classList.add("swap");reveal();document.title=t(NAV.find(n=>n[0]===v)[2])+" | SampCity RolePlay";scrollTo(0,0)}

// Navegación con control remoto (flechas) en televisores
if(/Tizen|Web0S|WebOS|SMART-?TV|AFT|Android.*TV|BRAVIA|Roku|CrKey|HbbTV/i.test(navigator.userAgent)||/[?&]tv=1/.test(location.search)){document.body.classList.add("tv");
 addEventListener("keydown",e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key],a=document.activeElement;if(!d||/INPUT|TEXTAREA/.test(a.tagName))return;
  const els=[...document.querySelectorAll("a[href],button")].filter(x=>x.offsetParent);e.preventDefault();if(!els.includes(a))return els[0]?.focus();
  const c=a.getBoundingClientRect(),cx=c.x+c.width/2,cy=c.y+c.height/2;let best=null,bs=1e9;
  for(const x of els){if(x===a)continue;const r=x.getBoundingClientRect(),dx=r.x+r.width/2-cx,dy=r.y+r.height/2-cy,al=dx*d[0]+dy*d[1];if(al<=1)continue;const s=al+Math.abs(d[0]?dy:dx)*2;if(s<bs){bs=s;best=x}}
  if(best){best.focus();best.scrollIntoView({block:"center"})}})}
